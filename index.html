<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>روزمرہ کا حساب کتاب - Muhammad Rasoolnagri</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
            --primary: #1b4d3e;
            --expense-color: #c62828;
            --border-color: #e0e0e0;
        }

        body.dark-mode {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --border-color: #333333;
        }

        * {
            box-sizing: border-box;
            font-family: 'Poppins', 'Noto Nastaliq Urdu', Tahoma, sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }

        body {
            background-color: var(--bg-color);
            margin: 0;
            padding: 15px;
            color: var(--text-color);
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .theme-toggle {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
        }

        .brand-section {
            text-align: center;
            margin-bottom: 20px;
        }

        .logo-badge {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #1b4d3e, #2c7a5f);
            color: #ffffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 700;
            margin: 0 auto 8px auto;
            box-shadow: 0 4px 10px rgba(27, 77, 62, 0.3);
        }

        .developer-tag {
            font-size: 11px;
            color: #777777;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin: 0;
        }

        .brand-name {
            font-size: 18px;
            font-weight: 700;
            color: var(--primary);
            margin: 2px 0 0 0;
        }

        h2 {
            text-align: center;
            color: var(--primary);
            margin-top: 10px;
            margin-bottom: 20px;
            font-size: 22px;
        }

        .dashboard-single {
            background: linear-gradient(135deg, #c62828, #e53935);
            color: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 4px 12px rgba(198, 40, 40, 0.2);
        }

        .dashboard-single span {
            font-size: 14px;
            display: block;
            opacity: 0.9;
        }

        .dashboard-single strong {
            font-size: 28px;
            margin-top: 5px;
            display: block;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 15px;
            background-color: var(--card-bg);
            color: var(--text-color);
        }

        button.btn-primary {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(27, 77, 62, 0.2);
        }

        .filters {
            display: flex;
            gap: 6px;
            margin: 20px 0 15px 0;
            flex-wrap: wrap;
        }

        .filters button {
            flex: 1;
            padding: 8px;
            font-size: 13px;
            background-color: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            cursor: pointer;
        }

        .filters button.active {
            background-color: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .custom-date {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }

        .list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .list-item-details {
            display: flex;
            flex-direction: column;
        }

        .list-item-title {
            font-weight: 600;
            font-size: 15px;
        }

        .list-item-sub {
            font-size: 12px;
            color: #888888;
            margin-top: 2px;
        }

        .list-item-amount {
            font-weight: bold;
            font-size: 16px;
            color: var(--expense-color);
        }

        .action-btns {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-excel {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
        }

        .btn-pdf {
            background-color: #c62828;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
        }

        @media print {
            body * {
                visibility: hidden;
            }
            #printableArea, #printableArea * {
                visibility: visible;
            }
            #printableArea {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                color: #000 !important;
                background: #fff !important;
            }
            .no-print {
                display: none !important;
            }
            .print-table {
                width: 100%;
                border-collapse: collapse;
                margin-top: 20px;
            }
            .print-table th, .print-table td {
                border: 1px solid #ddd;
                padding: 10px;
                text-align: right;
            }
            .print-table th {
                background-color: #f2f2f2;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-top no-print">
        <button class="theme-toggle" onclick="toggleTheme()" id="themeIcon">🌙</button>
    </div>

    <!-- Brand Header -->
    <div class="brand-section">
        <div class="logo-badge">MR</div>
        <p class="developer-tag">DEVELOPED BY</p>
        <h3 class="brand-name">Muhammad Rasoolnagri</h3>
    </div>

    <h2>روزمرہ کا حساب کتاب</h2>

    <!-- Total Expense Dashboard -->
    <div class="dashboard-single">
        <span>کل خرچ (Total Expenses)</span>
        <strong id="totalExpenseDisplay">Rs 0</strong>
    </div>

    <div class="no-print">
        <div class="form-group">
            <label>رقم (روپے):</label>
            <input type="number" id="amount" placeholder="مثلاً 500">
        </div>

        <div class="form-group">
            <label>تفصیل / مد (ذہین سسٹم کیٹگری خود چنے گا):</label>
            <input type="text" id="desc" placeholder="مثلاً حریسہ، سیمنٹ، 100 روپے فوٹو کاپی" oninput="autoDetectCategory(this.value)">
        </div>

        <div class="form-group">
            <label>کیٹگری:</label>
            <select id="category">
                <option value="عام (General)">عام (General)</option>
                <option value="ہوٹلنگ / کھانا">ہوٹلنگ / کھانا</option>
                <option value="راشن / گروسری">راشن / گروسری</option>
                <option value="گاڑی / فیول">گاڑی / فیول</option>
                <option value="کنسٹرکشن / تعمیرات">کنسٹرکشن / تعمیرات</option>
                <option value="موبائل / کریڈٹ">موبائل / کریڈٹ</option>
                <option value="اسٹیشنری / پرنٹنگ">اسٹیشنری / پرنٹنگ</option>
                <option value="بل / یوٹیلیٹی">بل / یوٹیلیٹی</option>
            </select>
        </div>

        <button class="btn-primary" onclick="addExpense()">محفوظ کریں</button>
        <hr style="margin: 20px 0; border: 0.1px solid var(--border-color);">

        <div class="filters">
            <button onclick="filterRecords('all')" id="btn-all" class="active">تمام ریکارڈ</button>
            <button onclick="filterRecords('today')" id="btn-today">آج</button>
            <button onclick="filterRecords('week')" id="btn-week">اس ہفتے</button>
            <button onclick="filterRecords('month')" id="btn-month">اس ماہ</button>
        </div>

        <div class="custom-date">
            <input type="date" id="startDate">
            <input type="date" id="endDate">
            <button onclick="filterCustomDate()" style="width: auto; padding: 6px 12px;">تلاش</button>
        </div>
    </div>

    <!-- Printable Report View -->
    <div id="printableArea">
        <div id="expensesList"></div>
    </div>

    <div class="action-btns no-print">
        <button class="btn-excel" onclick="exportToExcel()">Excel Backup ڈاؤن لوڈ کریں</button>
        <button class="btn-pdf" onclick="printPDF()">رسید / رپورٹ پرنٹ کریں (PDF)</button>
    </div>
</div>

<script>
    let expenses = JSON.parse(localStorage.getItem('mr_expenses_v2')) || [];

    const smartRules = [
        { 
            category: 'ہوٹلنگ / کھانا', 
            keywords: ['حریسہ', 'حلیم', 'روٹی', 'سالن', 'بریانی', 'چائے', 'ہوٹل', 'کھانا', 'برگر', 'پیزا', 'شوارما', 'کباب', 'تکہ', 'کڑاہی', 'نہاری', 'پائے', 'ناشتہ', 'مٹھائی', 'جلیبی', 'سموسہ', 'پکوڑے', 'دودھ', 'دہی', 'جوس', 'آئس کریم', 'کوکا کولا', 'کافی', 'فاسٹ فوڈ'] 
        },
        { 
            category: 'راشن / گروسری', 
            keywords: ['چینی', 'پتی', 'دال', 'چاول', 'گھی', 'تیل', 'صابن', 'سودا', 'راشن', 'آٹا', 'مسالے', 'سبزی', 'پھل', 'سیب', 'کیلا', 'گوشت', 'مرغی', 'چکن', 'بیف', 'مٹن', 'مچھلی'] 
        },
        { 
            category: 'کنسٹرکشن / تعمیرات', 
            keywords: ['سیمنٹ', 'بجری', 'اینٹ', 'ریت', 'کنسٹرکشن', 'تعمیر', 'پینٹ', 'لوہا', 'سریا', 'پائپ', 'ٹائل', 'مزدوری', 'مستری'] 
        },
        { 
            category: 'موبائل / کریڈٹ', 
            keywords: ['پیکج', 'موبائل', 'ایزی لوڈ', 'بیلنس', 'کال', 'نیٹ', 'ڈیٹا', 'جاز', 'زونگ', 'ٹیلی نار', 'وارد', 'یو فون'] 
        },
        { 
            category: 'اسٹیشنری / پرنٹنگ', 
            keywords: ['فوٹو کاپی', 'کاپی', 'پرنٹ', 'کاغذ', 'پنسل', 'پین', 'اسٹیشنری', 'کتاب', 'رجسٹر', 'فائل', 'بائنڈنگ'] 
        },
        { 
            category: 'گاڑی / فیول', 
            keywords: ['پیٹرول', 'ڈیزل', 'ٹیوننگ', 'سروس', 'انجن', 'مائل', 'واش', 'ٹائر', 'گاڑی', 'موٹر سائیکل', 'بائیک', 'مکینک', 'پنکچر', 'ائل'] 
        },
        { 
            category: 'بل / یوٹیلیٹی', 
            keywords: ['بجلی', 'گیس', 'پانی', 'انٹرنیٹ', 'بل', 'وایفائی', 'کیبل'] 
        }
    ];

    function autoDetectCategory(text) {
        if (!text) return;
        const select = document.getElementById('category');
        let matchedCategory = null;

        for (let rule of smartRules) {
            if (rule.keywords.some(kw => text.includes(kw))) {
                matchedCategory = rule.category;
                break;
            }
        }

        if (matchedCategory) {
            let optionExists = Array.from(select.options).some(opt => opt.value === matchedCategory);
            if (!optionExists) {
                let newOpt = document.createElement('option');
                newOpt.value = matchedCategory;
                newOpt.innerText = matchedCategory;
                select.appendChild(newOpt);
            }
            select.value = matchedCategory;
        }
    }

    function addExpense() {
        const amountInput = document.getElementById('amount');
        const descInput = document.getElementById('desc');
        const categorySelect = document.getElementById('category');

        const amount = amountInput.value.trim();
        const desc = descInput.value.trim();
        const category = categorySelect.value;

        if (!amount || !desc) {
            alert('براہ کرم رقم اور تفصیل دونوں درج کریں۔');
            return;
        }

        const item = {
            id: Date.now(),
            amount: parseFloat(amount),
            desc: desc,
            category: category,
            date: new Date().toLocaleDateString('en-GB')
        };

        expenses.unshift(item);
        saveAndRender();

        amountInput.value = '';
        descInput.value = '';
        categorySelect.value = 'عام (General)';
    }

    function deleteExpense(id) {
        expenses = expenses.filter(item => item.id !== id);
        saveAndRender();
    }

    function saveAndRender() {
        localStorage.setItem('mr_expenses_v2', JSON.stringify(expenses));
        render(expenses);
    }

    function render(data = expenses) {
        const listContainer = document.getElementById('expensesList');
        const totalDisplay = document.getElementById('totalExpenseDisplay');

        let total = data.reduce((sum, item) => sum + item.amount, 0);
        totalDisplay.innerText = 'Rs ' + total.toLocaleString();

        if (data.length === 0) {
            listContainer.innerHTML = '<p style="text-align:center; color:#888; padding:20px;">کوئی ریکارڈ موجود نہیں ہے۔</p>';
            return;
        }

        let html = '<div class="no-print">';
        data.forEach(item => {
            html += `
                <div class="list-item">
                    <div class="list-item-details">
                        <span class="list-item-title">${item.desc}</span>
                        <span class="list-item-sub">${item.category} | ${item.date}</span>
                    </div>
                    <div style="display:flex; align-items:center; gap:10px;">
                        <span class="list-item-amount">Rs ${item.amount} -</span>
                        <button onclick="deleteExpense(${item.id})" style="background:none; border:none; color:#c62828; cursor:pointer; font-size:16px;">🗑️</button>
                    </div>
                </div>
            `;
        });
        html += '</div>';

        html += `
            <div class="printable-only" style="display:none;">
                <h2 style="text-align:center; margin-bottom:5px;">Muhammad Rasoolnagri</h2>
                <p style="text-align:center; margin-top:0; font-size:12px;">اخراجات رپورٹ - تاریخ: ${new Date().toLocaleDateString('en-GB')}</p>
                <table class="print-table">
                    <thead>
                        <tr>
                            <th>تاریخ</th>
                            <th>تفصیل</th>
                            <th>کیٹگری</th>
                            <th>رقم</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${data.map(i => `
                            <tr>
                                <td>${i.date}</td>
                                <td>${i.desc}</td>
                                <td>${i.category}</td>
                                <td>Rs ${i.amount}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
                <h3 style="text-align:left; margin-top:15px;">کل خرچ: Rs ${total.toLocaleString()}</h3>
            </div>
        `;

        listContainer.innerHTML = html;
    }

    function filterRecords(type) {
        document.querySelectorAll('.filters button').forEach(b => b.classList.remove('active'));
        document.getElementById('btn-' + type).classList.add('active');

        const now = new Date();
        let filtered = expenses;

        if (type === 'today') {
            const todayStr = now.toLocaleDateString('en-GB');
            filtered = expenses.filter(i => i.date === todayStr);
        } else if (type === 'week') {
            const weekAgo = new Date(now.setDate(now.getDate() - 7));
            filtered = expenses.filter(i => new Date(i.id) >= weekAgo);
        } else if (type === 'month') {
            const currentMonth = new Date().getMonth();
            filtered = expenses.filter(i => new Date(i.id).getMonth() === currentMonth);
        }

        render(filtered);
    }

    function printPDF() {
        window.print();
    }

    function exportToExcel() {
        let csv = 'Date,Description,Category,Amount\n';
        expenses.forEach(i => {
            csv += `"${i.date}","${i.desc}","${i.category}","${i.amount}"\n`;
        });

        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = 'Mera_Hisab_Report_' + Date.now() + '.csv';
        link.click();
    }

    function toggleTheme() {
        document.body.classList.toggle('dark-mode');
        const icon = document.getElementById('themeIcon');
        icon.innerText = document.body.classList.contains('dark-mode') ? '☀️' : '🌙';
    }

    render();
</script>

</body>
</html>
