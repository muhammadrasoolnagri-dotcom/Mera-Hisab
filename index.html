<!DOCTYPE html>

    <!-- Linking PWA Manifest -->

    <style>

        h2 {

            margin-bottom: 20px;

        }

        .dashboard-single {

        .dashboard-single strong {

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 15px;
            background-color: var(--card-bg);
            color: var(--text-color);
        }

        button.btn-primary {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(27, 77, 62, 0.2);
        }

        .filters {
            display: flex;
            gap: 6px;
            margin: 20px 0 15px 0;
            flex-wrap: wrap;
        }

        .filters button {
            flex: 1;
            padding: 8px;
            font-size: 13px;
            background-color: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            cursor: pointer;
        }

        .filters button.active {
            background-color: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .custom-date {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }

        .list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid var(--border-color);

            display: flex;
            flex-direction: column;
        }

        .btn-excel {
            background-color: #27ae60;

            border: none;

            background-color: #c62828;
            color: white;
            border: none;
            padding: 12px;

            width: 100%;
        }
    </style>

<body>

<div class="container">
    <div class="header-top">
        <button class="theme-toggle" onclick="toggleTheme()" id="themeIcon">🌙</button>
    </div>

    <!-- Brand Header -->
    <div class="brand-section">
        <div class="logo-badge">MR</div>
        <p class="developer-tag">DEVELOPED BY</p>
        <h3 class="brand-name">Muhammad Rasoolnagri</h3>
    </div>

    <h2>روزمرہ کا حساب کتاب</h2>

    <!-- Total Expense Dashboard -->
    <div class="dashboard-single">
        <span>کل خرچ (Total Expenses)</span>
        <strong id="totalExpenseDisplay">Rs 0</strong>
    </div>

    <div>
        <div class="form-group">
            <label>رقم (روپے):</label>
            <input type="number" id="amount" placeholder="مثلاً 500">
        </div>

        <div class="form-group">
            <label>تفصیل / مد (ذہین آٹو کیٹگری ڈٹیکٹر):</label>
            <input type="text" id="desc" placeholder="مثلاً بیڈ، چارپائی، فرائز، چارجر" oninput="smartDetectCategory(this.value)">
        </div>

        <div class="form-group">
            <label>کیٹگری:</label>
            <select id="category">
                <option value="عام (General)">عام (General)</option>
                <option value="فرنیچر / گھریلو سامان">فرنیچر / گھریلو سامان</option>
                <option value="ہوٹلنگ / کھانا">ہوٹلنگ / کھانا</option>
                <option value="راشن / گروسری">راشن / گروسری</option>
                <option value="گاڑی / فیول">گاڑی / فیول</option>
                <option value="کنسٹرکشن / تعمیرات">کنسٹرکشن / تعمیرات</option>
                <option value="موبائل / کریڈٹ">موبائل / کریڈٹ</option>
                <option value="اسٹیشنری / پرنٹنگ">اسٹیشنری / پرنٹنگ</option>
                <option value="بل / یوٹیلیٹی">بل / یوٹیلیٹی</option>
                <option value="میڈیکل / صحت">میڈیکل / صحت</option>
                <option value="الیکٹرانکس / ڈیوائس">الیکٹرانکس / ڈیوائس</option>
                <option value="فنانس / ٹرانسفر">فنانس / ٹرانسفر</option>
            </select>
        </div>

        <button class="btn-primary" onclick="addExpense()">محفوظ کریں</button>
        <hr style="margin: 20px 0; border: 0.1px solid var(--border-color);">

        <div class="filters">
            <button onclick="filterRecords('all')" id="btn-all" class="active">تمام ریکارڈ</button>
            <button onclick="filterRecords('today')" id="btn-today">آج</button>
            <button onclick="filterRecords('week')" id="btn-week">اس ہفتے</button>
            <button onclick="filterRecords('month')" id="btn-month">اس ماہ</button>
        </div>

        <div class="custom-date">
            <input type="date" id="startDate">
            <input type="date" id="endDate">
            <button onclick="filterCustomDate()" style="width: auto; padding: 6px 12px;">تلاش</button>
        </div>
    </div>

    <!-- Expenses List Area -->
    <div id="expensesList" style="margin-top: 15px;"></div>

    <div class="action-btns" style="margin-top: 20px;">
        <button class="btn-excel" onclick="exportToExcel()">Excel Backup ڈاؤن لوڈ کریں</button>
        <button class="btn-download" onclick="downloadReceiptFile()">حساب کتاب کی فائل ڈاؤن لوڈ کریں (Receipt)</button>
    </div>
</div>

<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js').catch(err => console.log(err));
        });
    }

    function getMergedExpenses() {
        let keys = ['mr_expenses_master', 'mr_expenses_ai_v1', 'mr_expenses_v2', 'mr_expenses_only', 'expenses'];
        let allData = [];
        let seenIds = new Set();

        keys.forEach(key => {
            let item = localStorage.getItem(key);
            if (item) {
                try {
                    let parsed = JSON.parse(item);
                    if (Array.isArray(parsed)) {
                        parsed.forEach(exp => {
                            if (exp && exp.amount) {
                                if (!exp.type || exp.type === 'expense') {
                                    let uniqueId = exp.id || (exp.desc + exp.amount + exp.date);
                                    if (!seenIds.has(uniqueId)) {
                                        seenIds.add(uniqueId);
                                        allData.push({
                                            id: exp.id || Date.now() + Math.random(),
                                            amount: parseFloat(exp.amount),
                                            desc: exp.desc || 'خرچ',
                                            category: exp.category || 'عام (General)',
                                            date: exp.date || new Date().toLocaleDateString('en-GB')
                                        });
                                    }
                                }
                            }
                        });
                    }
                } catch(e){}
            }
        });
        return allData;
    }

    let expenses = getMergedExpenses();

    function saveMasterData() {
        localStorage.setItem('mr_expenses_master', JSON.stringify(expenses));
    }
    saveMasterData();

    // Smart Rules Engine
    const smartRules = [
        {
            category: 'فرنیچر / گھریلو سامان',
            keywords: ['بیڈ', 'چارپائی', 'صوفہ', 'کرسی', 'میز', 'ٹیبل', 'الماری', 'گدا', 'میٹرس', 'پردے', 'فرنیچر', 'چادر', 'تکیہ', 'فوم']
        },
        { 
            category: 'ہوٹلنگ / کھانا', 
            keywords: ['حریسہ', 'حلیم', 'روٹی', 'سالن', 'بریانی', 'چائے', 'ہوٹل', 'کھانا', 'برگر', 'پیزا', 'شوارما', 'کباب', 'تکہ', 'کڑاہی', 'نہاری', 'پائے', 'ناشتہ', 'مٹھائی', 'جلیبی', 'سموسہ', 'پکوڑے', 'دودھ', 'دہی', 'جوس', 'آئس کریم', 'کوکا کولا', 'کافی', 'فاسٹ فوڈ', 'فرائز', 'ونگز', 'زنگر', 'شوربا', 'سٹیک'] 
        },
        { 
            category: 'راشن / گروسری', 
            keywords: ['چینی', 'پتی', 'دال', 'چاول', 'گھی', 'تیل', 'صابن', 'سودا', 'راشن', 'آٹا', 'مسالے', 'سبزی', 'پھل', 'سیب', 'کیلا', 'گوشت', 'مرغی', 'چکن', 'بیف', 'مٹن', 'مچھلی', 'سرف', 'تپال'] 
        },
        { 
            category: 'میڈیکل / صحت', 
            keywords: ['دوائی', 'میڈیسن', 'ڈاکٹر', 'سیرپ', 'ٹیبلٹ', 'ٹیسٹ', 'لیب', 'ہسپتال', 'میڈیکل', 'پٹی', 'انجکشن', 'کلینک', 'فیبر'] 
        },
        { 
            category: 'الیکٹرانکس / ڈیوائس', 
            keywords: ['چارجر', 'ڈیٹا کیبل', 'ہینڈز فری', 'ہیڈ فون', 'مائیک', 'کور', 'گلاس', 'ایئرپوڈز', 'کیبل', 'پاور بینک', 'موبائل لوازمات'] 
        },
        { 
            category: 'بل / یوٹیلیٹی', 
            keywords: ['بجلی', 'گیس', 'پانی', 'انٹرنیٹ', 'بل', 'وایفائی', 'وائی فائی', 'کیبل', 'نیپرا', 'گیپکو', 'پی ٹی سی ایل'] 
        },
        { 
            category: 'فنانس / ٹرانسفر', 
            keywords: ['جیز کیش', 'ایزی پیسہ', 'بینک', 'کیش', 'ٹرانسفر', 'فیس', 'آن لائن', 'اے ٹی ایم', 'سنیپ'] 
        },
        { 
            category: 'کنسٹرکشن / تعمیرات', 
            keywords: ['سیمنٹ', 'بجری', 'اینٹ', 'ریت', 'کنسٹرکشن', 'تعمیر', 'پینٹ', 'لوہا', 'سریا', 'پائپ', 'ٹائل', 'مزدوری', 'مستری', 'ہارڈویئر'] 
        },
        { 
            category: 'موبائل / کریڈٹ', 
            keywords: ['پیکج', 'موبائل', 'ایزی لوڈ', 'بیلنس', 'کال', 'نیٹ', 'ڈیٹا', 'جاز', 'زونگ', 'ٹیلی نار', 'وارد', 'یو فون', 'جازپیکج'] 
        },
        { 
            category: 'اسٹیشنری / پرنٹنگ', 
            keywords: ['فوٹو کاپی', 'کاپی', 'پرنٹ', 'کاغذ', 'پنسل', 'پین', 'اسٹیشنری', 'کتاب', 'رجسٹر', 'فائل', 'بائنڈنگ', 'شاپ'] 
        },
        { 
            category: 'گاڑی / فیول', 
            keywords: ['پیٹرول', 'ڈیزل', 'ٹیوننگ', 'سروس', 'انجن', 'مائل', 'واش', 'ٹائر', 'گاڑی', 'موٹر سائیکل', 'بائیک', 'مکینک', 'پنکچر', 'ائل', 'تیل بائیک'] 
        }
    ];

    function smartDetectCategory(text) {
        if (!text) return;
        const select = document.getElementById('category');
        let cleanText = text.toLowerCase().trim();
        let matchedCategory = null;

        for (let rule of smartRules) {
            if (rule.keywords.some(kw => cleanText.includes(kw.toLowerCase()))) {
                matchedCategory = rule.category;
                break;
            }
        }

        if (matchedCategory) {
            let optionExists = Array.from(select.options).some(opt => opt.value === matchedCategory);
            if (!optionExists) {
                let newOpt = document.createElement('option');
                newOpt.value = matchedCategory;
                newOpt.innerText = matchedCategory;
                select.appendChild(newOpt);
            }
            select.value = matchedCategory;
        }
    }

    function addExpense() {
        const amountInput = document.getElementById('amount');
        const descInput = document.getElementById('desc');
        const categorySelect = document.getElementById('category');

        const amount = amountInput.value.trim();
        const desc = descInput.value.trim();
        let category = categorySelect.value;

        if (!amount || !desc) {
            alert('براہ کرم رقم اور تفصیل دونوں درج کریں۔');
            return;
        }

        const item = {
            id: Date.now(),
            amount: parseFloat(amount),
            desc: desc,
            category: category,
            date: new Date().toLocaleDateString('en-GB')
        };

        expenses.unshift(item);
        saveAndRender();

        amountInput.value = '';
        descInput.value = '';
        categorySelect.value = 'عام (General)';
    }

    function deleteExpense(id) {
        expenses = expenses.filter(item => item.id !== id);
        saveAndRender();
    }

    function saveAndRender() {
        saveMasterData();
        render(expenses);
    }

    function render(data = expenses) {
        const listContainer = document.getElementById('expensesList');
        const totalDisplay = document.getElementById('totalExpenseDisplay');

        let total = data.reduce((sum, item) => sum + item.amount, 0);
        totalDisplay.innerText = 'Rs ' + total.toLocaleString();

        if (data.length === 0) {
            listContainer.innerHTML = '<p style="text-align:center; color:#888; padding:20px;">کوئی ریکارڈ موجود نہیں ہے۔</p>';
            return;
        }

        let html = '';
        data.forEach(item => {
            html += `
                <div class="list-item">
                    <div class="list-item-details">
                        <span class="list-item-title">${item.desc}</span>
                        <span class="list-item-sub">${item.category} | ${item.date}</span>
                    </div>
                    <div style="display:flex; align-items:center; gap:10px;">
                        <span class="list-item-amount">Rs ${item.amount} -</span>
                        <button onclick="deleteExpense(${item.id})" style="background:none; border:none; color:#c62828; cursor:pointer; font-size:16px;">🗑️</button>
                    </div>
                </div>
            `;
        });

        listContainer.htmlContainer = listContainer.innerHTML = html;
    }

    function filterRecords(type) {
        document.querySelectorAll('.filters button').forEach(b => b.classList.remove('active'));
        document.getElementById('btn-' + type).classList.add('active');

        const now = new Date();
        let filtered = expenses;

        if (type === 'today') {
            const todayStr = now.toLocaleDateString('en-GB');
            filtered = expenses.filter(i => i.date === todayStr);
        } else if (type === 'week') {
            const weekAgo = new Date(now.setDate(now.getDate() - 7));
            filtered = expenses.filter(i => new Date(i.id) >= weekAgo);
        } else if (type === 'month') {
            const currentMonth = new Date().getMonth();
            filtered = expenses.filter(i => new Date(i.id).getMonth() === currentMonth);
        }

        render(filtered);
    }

    // Bulletproof Clean HTML Receipt File Downloader (Zero Print Dialog Errors)
    function downloadReceiptFile() {
        let total = expenses.reduce((sum, item) => sum + item.amount, 0);
        let htmlContent = `<!DOCTYPE html>

<body>

        <tbody>
