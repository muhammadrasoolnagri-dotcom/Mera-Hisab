<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>روزمرہ کا حساب کتاب - Muhammad Rasoolnagri</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', 'Noto Nastaliq Urdu', sans-serif; background: #f4f7f6; margin: 0; padding: 15px; display: flex; justify-content: center; color: #333; }
        .container { width: 100%; max-width: 500px; background: #ffffff; padding: 20px; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); }
        .brand-section { text-align: center; margin-bottom: 20px; }
        .logo-badge { width: 60px; height: 60px; background: #1b4d3e; color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700; margin: 0 auto 8px auto; }
        .dashboard-single { background: #c62828; color: white; padding: 20px; border-radius: 12px; text-align: center; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 14px; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; }
        button.btn-primary { width: 100%; background-color: #1b4d3e; color: white; border: none; padding: 14px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .list-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid #eee; }
        .btn-download { background-color: #c62828; color: white; border: none; padding: 14px; border-radius: 8px; font-weight: bold; width: 100%; margin-top: 15px; cursor: pointer; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <div class="brand-section">
        <div class="logo-badge">MR</div>
        <p style="font-size: 11px; color: #777; margin:0;">DEVELOPED BY</p>
        <h3 style="font-size: 18px; color: #1b4d3e; margin: 2px 0 0 0;">Muhammad Rasoolnagri</h3>
    </div>

    <h2>روزمرہ کا حساب کتاب</h2>

    <div class="dashboard-single">
        <span>کل خرچ (Total Expenses)</span>
        <strong id="totalExpenseDisplay" style="font-size: 28px; display: block; margin-top: 5px;">Rs 0</strong>
    </div>

    <div class="form-group">
        <label>رقم (روپے):</label>
        <input type="number" id="amount" placeholder="مثلاً 500">
    </div>

    <div class="form-group">
        <label>تفصیل / مد:</label>
        <input type="text" id="desc" placeholder="مثلاً بیڈ، چارپائی، پیزا، ریت" oninput="smartDetectCategory(this.value)">
    </div>

    <div class="form-group">
        <label>کیٹگری:</label>
        <select id="category">
            <option value="عام (General)">عام (General)</option>
            <option value="فرنیچر / گھریلو سامان">فرنیچر / گھریلو سامان</option>
            <option value="ہوٹلنگ / کھانا">ہوٹلنگ / کھانا</option>
            <option value="راشن / گروسری">راشن / گروسری</option>
            <option value="کنسٹرکشن / تعمیرات">کنسٹرکشن / تعمیرات</option>
            <option value="الیکٹرانکس / ڈیوائس">الیکٹرانکس / ڈیوائس</option>
        </select>
    </div>

    <button class="btn-primary" onclick="addExpense()">محفوظ کریں</button>

    <div id="expensesList" style="margin-top: 15px;"></div>

    <button class="btn-download" onclick="downloadReceiptFile()">رسید فائل ڈاؤن لوڈ کریں</button>
</div>

<script>
    function getMergedExpenses() {
        let keys = ['mr_expenses_master', 'mr_expenses_ai_v1', 'mr_expenses_v2', 'mr_expenses_only', 'expenses'];
        let allData = [];
        let seenIds = new Set();
        keys.forEach(key => {
            let item = localStorage.getItem(key);
            if (item) {
                try {
                    let parsed = JSON.parse(item);
                    if (Array.isArray(parsed)) {
                        parsed.forEach(exp => {
                            if (exp && exp.amount) {
                                let uniqueId = exp.id || (exp.desc + exp.amount + exp.date);
                                if (!seenIds.has(uniqueId)) {
                                    seenIds.add(uniqueId);
                                    allData.push({
                                        id: exp.id || Date.now() + Math.random(),
                                        amount: parseFloat(exp.amount),
                                        desc: exp.desc || 'خرچ',
                                        category: exp.category || 'عام (General)',
                                        date: exp.date || new Date().toLocaleDateString('en-GB')
                                    });
                                }
                            }
                        });
                    }
                } catch(e){}
            }
        });
        return allData;
    }

    let expenses = getMergedExpenses();
    function saveMasterData() { localStorage.setItem('mr_expenses_master', JSON.stringify(expenses)); }
    saveMasterData();

    const smartRules = [
        { category: 'فرنیچر / گھریلو سامان', keywords: ['بیڈ', 'چارپائی', 'صوفہ', 'کرسی', 'میز', 'ٹیبل', 'الماری', 'گدا'] },
        { category: 'ہوٹلنگ / کھانا', keywords: ['پیزا', 'برگر', 'روٹی', 'سالن', 'بریانی', 'چائے', 'حریسہ', 'فرائز', 'ونگز'] },
        { category: 'کنسٹرکشن / تعمیرات', keywords: ['ریت', 'مستری', 'سیمنٹ', 'بجری', 'اینٹ', 'سریا'] },
        { category: 'الیکٹرانکس / ڈیوائس', keywords: ['چارجر', 'کیبل', 'موبایل', 'ہینڈز فری'] }
    ];

    function smartDetectCategory(text) {
        if (!text) return;
        const select = document.getElementById('category');
        let cleanText = text.toLowerCase().trim();
        for (let rule of smartRules) {
            if (rule.keywords.some(kw => cleanText.includes(kw.toLowerCase()))) {
                select.value = rule.category;
                break;
            }
        }
    }

    function addExpense() {
        const amount = document.getElementById('amount').value.trim();
        const desc = document.getElementById('desc').value.trim();
        const category = document.getElementById('category').value;
        if (!amount || !desc) { alert('رقم اور تفصیل درج کریں'); return; }
        expenses.unshift({ id: Date.now(), amount: parseFloat(amount), desc, category, date: new Date().toLocaleDateString('en-GB') });
        saveMasterData();
        render();
        document.getElementById('amount').value = '';
        document.getElementById('desc').value = '';
    }

    function deleteExpense(id) {
        expenses = expenses.filter(i => i.id !== id);
        saveMasterData();
        render();
    }

    function render() {
        const listContainer = document.getElementById('expensesList');
        let total = expenses.reduce((sum, i) => sum + i.amount, 0);
        document.getElementById('totalExpenseDisplay').innerText = 'Rs ' + total.toLocaleString();
        if (expenses.length === 0) { listContainer.innerHTML = '<p style="text-align:center; color:#888;">کوئی ریکارڈ موجود نہیں</p>'; return; }
        let html = '';
        expenses.forEach(i => {
            html += `<div class="list-item">
                <div><strong>${i.desc}</strong><br><small style="color:#777;">${i.category} | ${i.date}</small></div>
                <div style="display:flex; align-items:center; gap:10px;">
                    <span style="color:#c62828; font-weight:bold;">Rs ${i.amount}</span>
                    <button onclick="deleteExpense(${i.id})" style="background:none; border:none; cursor:pointer;">🗑️</button>
                </div>
            </div>`;
        });
        listContainer.innerHTML = html;
    }

    function downloadReceiptFile() {
        let total = expenses.reduce((sum, i) => sum + i.amount, 0);
        let htmlContent = `<!DOCTYPE html><html lang="ur" dir="rtl"><head><meta charset="UTF-8"><title>رسید</title></head><body style="font-family: Tahoma; padding: 20px; direction: rtl;">
        <h2 style="color: #1b4d3e; text-align: center;">Muhammad Rasoolnagri</h2>
        <p style="text-align: center;">روزمرہ اخراجات کی رپورٹ</p>
        <table border="1" style="width: 100%; border-collapse: collapse; margin-top: 20px;">
        <tr><th>تاریخ</th><th>تفصیل</th><th>کیٹگری</th><th>رقم</th></tr>
        ${expenses.map(i => `<tr><td>${i.date}</td><td>${i.desc}</td><td>${i.category}</td><td>Rs ${i.amount}</td></tr>`).join('')}
        </table>
        <h3 style="text-align: left; color: #c62828; margin-top: 20px;">کل خرچ: Rs ${total}</h3></body></html>`;
        
        let blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8;' });
        let link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = 'Mera_Hisab_Receipt.html';
        link.click();
    }

    render();
</script>
</body>
</html>
