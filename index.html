<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>روزمرہ کا حساب کتاب - Muhammad Rasoolnagri</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
            --primary: #1b4d3e;
            --primary-accent: #2c7a5f;
            --income-color: #2e7d32;
            --expense-color: #c62828;
            --border-color: #e0e0e0;
        }

        body.dark-mode {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --primary: #2c7a5f;
            --primary-accent: #3d9978;
            --border-color: #333333;
        }

        body {
            font-family: 'Poppins', 'Noto Nastaliq Urdu', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            transition: all 0.3s ease;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .brand-header {
            text-align: center;
            padding-bottom: 15px;
            border-bottom: 2px dashed var(--border-color);
            margin-bottom: 20px;
            position: relative;
        }

        .brand-logo {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #1b4d3e, #2c7a5f);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 22px;
            margin: 0 auto 10px auto;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .developer-title {
            font-size: 11px;
            color: #888;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin: 0;
        }

        .developer-name {
            font-size: 18px;
            font-weight: 700;
            color: var(--primary-accent);
            margin: 2px 0;
        }

        .app-title {
            font-size: 20px;
            margin-top: 10px;
            font-weight: 700;
        }

        .theme-toggle {
            position: absolute;
            top: 0;
            left: 0;
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
        }

        .summary-cards {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .card {
            padding: 10px;
            border-radius: 12px;
            text-align: center;
            color: white;
        }

        .card-income { background: #2e7d32; }
        .card-expense { background: #c62828; }
        .card-balance { background: #1565c0; }

        .card h4 { margin: 0; font-size: 11px; opacity: 0.9; }
        .card p { margin: 5px 0 0 0; font-size: 14px; font-weight: bold; }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 13px;
            font-weight: 600;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            background: var(--bg-color);
            color: var(--text-color);
            box-sizing: border-box;
            font-size: 14px;
        }

        .type-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
        }

        .type-btn {
            flex: 1;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            background: var(--bg-color);
            color: var(--text-color);
            cursor: pointer;
            text-align: center;
            font-weight: bold;
        }

        .type-btn.active.expense { background: #c62828; color: white; border-color: #c62828; }
        .type-btn.active.income { background: #2e7d32; color: white; border-color: #2e7d32; }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        .btn-primary { background: var(--primary-accent); color: white; }
        .btn-excel { background: #1f7244; color: white; margin-top: 10px; }
        .btn-pdf { background: #d32f2f; color: white; margin-top: 10px; }

        .filters {
            display: flex;
            gap: 5px;
            margin: 20px 0 10px 0;
            overflow-x: auto;
        }

        .filter-btn {
            flex: 1;
            padding: 8px;
            border: 1px solid var(--border-color);
            background: var(--bg-color);
            color: var(--text-color);
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            white-space: nowrap;
        }

        .filter-btn.active {
            background: var(--primary);
            color: white;
        }

        .entry-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .entry-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .entry-details {
            display: flex;
            flex-direction: column;
        }

        .entry-title { font-weight: bold; font-size: 14px; }
        .entry-meta { font-size: 11px; color: #777; }
        .entry-amount { font-weight: bold; }
        .amount-expense { color: #c62828; }
        .amount-income { color: #2e7d32; }

        .badge {
            display: inline-block;
            padding: 2px 6px;
            font-size: 10px;
            border-radius: 4px;
            background: #eee;
            color: #333;
            margin-right: 5px;
        }

        .delete-btn {
            background: none;
            border: none;
            color: #ff5252;
            cursor: pointer;
            font-size: 16px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="brand-header">
        <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
        <div class="brand-logo">MR</div>
        <p class="developer-title">DEVELOPED BY</p>
        <div class="developer-name">Muhammad Rasoolnagri</div>
        <div class="app-title">روزمرہ کا حساب کتاب</div>
    </div>

    <!-- Summary Dashboard -->
    <div class="summary-cards">
        <div class="card card-income">
            <h4>کل آمدنی</h4>
            <p id="totalIncome">Rs 0</p>
        </div>
        <div class="card card-expense">
            <h4>کل خرچ</h4>
            <p id="totalExpense">Rs 0</p>
        </div>
        <div class="card card-balance">
            <h4>باقی بیلنس</h4>
            <p id="totalBalance">Rs 0</p>
        </div>
    </div>

    <!-- Type Selector -->
    <div class="type-selector">
        <div class="type-btn active expense" id="btnExpense" onclick="setType('expense')">خرچ (Expense)</div>
        <div class="type-btn" id="btnIncome" onclick="setType('income')">آمدنی (Income)</div>
    </div>

    <!-- Form -->
    <div class="form-group">
        <label>رقم (روپے):</label>
        <input type="number" id="amount" placeholder="مثلاً: 500">
    </div>

    <div class="form-group">
        <label>تفصیل / مد (ذہین سسٹم کیٹگری خود چنے گا):</label>
        <input type="text" id="description" placeholder="مثلاً: 100 چینی، پیٹرول، بجلی کا بل" oninput="autoDetectCategory(this.value)">
    </div>

    <div class="form-group">
        <label>کیٹگری:</label>
        <select id="category">
            <option value="عام">عام (General)</option>
            <option value="راشن / گروسری">راشن / گروسری</option>
            <option value="گاڑی / فیول">گاڑی / فیول</option>
            <option value="ہوٹلنگ / کھانا">ہوٹلنگ / کھانا</option>
            <option value="ماہانہ بلز">ماہانہ بلز</option>
            <option value="آمدنی / تنخواہ">آمدنی / تنخواہ</option>
        </select>
    </div>

    <button class="btn btn-primary" onclick="addEntry()">محفوظ کریں</button>

    <!-- Filters -->
    <div class="filters">
        <button class="filter-btn active" onclick="filterData('all')">تمام ریکارڈ</button>
        <button class="filter-btn" onclick="filterData('today')">آج</button>
        <button class="filter-btn" onclick="filterData('week')">اس ہفتے</button>
        <button class="filter-btn" onclick="filterData('month')">اس ماہ</button>
    </div>

    <!-- List -->
    <ul class="entry-list" id="entryList"></ul>

    <!-- Export Buttons -->
    <button class="btn btn-excel" onclick="exportToCSV()">Excel Backup ڈاؤن لوڈ کریں</button>
    <button class="btn btn-pdf" onclick="generatePDF()">رسید / رپورٹ پرنٹ کریں (PDF)</button>
</div>

<script>
    let entries = JSON.parse(localStorage.getItem('mr_entries')) || [];
    let currentType = 'expense';
    let currentFilter = 'all';

    function setType(type) {
        currentType = type;
        document.getElementById('btnExpense').classList.toggle('active', type === 'expense');
        document.getElementById('btnIncome').classList.toggle('active', type === 'income');
        if(type === 'income') {
            document.getElementById('category').value = 'آمدنی / تنخواہ';
        }
    }

    function autoDetectCategory(text) {
        if (currentType === 'income') return;
        text = text.toLowerCase();
        const catSelect = document.getElementById('category');

        if (/چینی|آٹا|گھی|دال|صابن|دودھ|سبزی|گوشت|راشن|گروسری/.test(text)) {
            catSelect.value = 'راشن / گروسری';
        } else if (/پیٹرول|ڈیزل|سروس|ٹیوننگ|آئل|ٹائر|گاڑی|بائیک/.test(text)) {
            catSelect.value = 'گاڑی / فیول';
        } else if (/برگر|روٹی|ریسٹورنٹ|ڈنر|ہوٹل|چائے|کھانا|لنچ/.test(text)) {
            catSelect.value = 'ہوٹلنگ / کھانا';
        } else if (/بجلی|گیس|وائی فائی|نیٹ|ریچارج|موبائل|بل/.test(text)) {
            catSelect.value = 'ماہانہ بلز';
        }
    }

    function addEntry() {
        const amount = parseFloat(document.getElementById('amount').value);
        const description = document.getElementById('description').value.trim();
        const category = document.getElementById('category').value;

        if (!amount || !description) {
            alert('براہ کرم رقم اور تفصیل دونوں درج کریں!');
            return;
        }

        const newEntry = {
            id: Date.now(),
            amount: amount,
            description: description,
            category: category,
            type: currentType,
            date: new Date().toISOString()
        };

        entries.unshift(newEntry);
        saveAndRender();

        document.getElementById('amount').value = '';
        document.getElementById('description').value = '';
    }

    function deleteEntry(id) {
        entries = entries.filter(e => e.id !== id);
        saveAndRender();
    }

    function saveAndRender() {
        localStorage.setItem('mr_entries', JSON.stringify(entries));
        renderList();
        updateDashboard();
    }

    function updateDashboard() {
        let income = entries.filter(e => e.type === 'income').reduce((sum, e) => sum + e.amount, 0);
        let expense = entries.filter(e => e.type === 'expense').reduce((sum, e) => sum + e.amount, 0);
        let balance = income - expense;

        document.getElementById('totalIncome').innerText = `Rs ${income}`;
        document.getElementById('totalExpense').innerText = `Rs ${expense}`;
        document.getElementById('totalBalance').innerText = `Rs ${balance}`;
    }

    function filterData(filter) {
        currentFilter = filter;
        document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');
        renderList();
    }

    function renderList() {
        const list = document.getElementById('entryList');
        list.innerHTML = '';

        let filtered = entries.filter(e => {
            const date = new Date(e.date);
            const today = new Date();
            if (currentFilter === 'today') {
                return date.toDateString() === today.toDateString();
            } else if (currentFilter === 'week') {
                const oneWeekAgo = new Date(today.setDate(today.getDate() - 7));
                return date >= oneWeekAgo;
            } else if (currentFilter === 'month') {
                return date.getMonth() === new Date().getMonth() && date.getFullYear() === new Date().getFullYear();
            }
            return true;
        });

        filtered.forEach(e => {
            const li = document.createElement('li');
            li.className = 'entry-item';
            const formattedDate = new Date(e.date).toLocaleDateString('ur-PK');

            li.innerHTML = `
                <div class="entry-details">
                    <span class="entry-title">${e.description}</span>
                    <span class="entry-meta">
                        <span class="badge">${e.category}</span>
                        ${formattedDate}
                    </span>
                </div>
                <div>
                    <span class="entry-amount ${e.type === 'income' ? 'amount-income' : 'amount-expense'}">
                        ${e.type === 'income' ? '+' : '-'} Rs ${e.amount}
                    </span>
                    <button class="delete-btn" onclick="deleteEntry(${e.id})">🗑️</button>
                </div>
            `;
            list.appendChild(li);
        });
    }

    function toggleTheme() {
        document.body.classList.toggle('dark-mode');
    }

    function exportToCSV() {
        let csv = 'تاریخ,تفصیل,کیٹگری,قسم,رقم\n';
        entries.forEach(e => {
            csv += `"${new Date(e.date).toLocaleDateString()}","${e.description}","${e.category}","${e.type}","${e.amount}"\n`;
        });
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `Mera_Hisab_Backup_${new Date().toLocaleDateString()}.csv`;
        link.click();
    }

    function generatePDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        doc.text("Muhammad Rasoolnagri - Expense Report", 14, 15);
        doc.text(`Generated on: ${new Date().toLocaleDateString()}`, 14, 23);

        const tableData = entries.map(e => [
            new Date(e.date).toLocaleDateString(),
            e.description,
            e.category,
            e.type === 'income' ? 'Income' : 'Expense',
            `Rs ${e.amount}`
        ]);

        doc.autoTable({
            head: [['Date', 'Description', 'Category', 'Type', 'Amount']],
            body: tableData,
            startY: 30
        });

        doc.save('Hisab_Report.pdf');
    }

    // Initial Load
    saveAndRender();
</script>
</body>
    </html>
